[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cognishift"
version = "0.1.0"
description = "Provider-grouped prediction of next-window order-modification activity"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{name = "Catalyst Crew"}]
dependencies = [
    "numpy>=2.5,<2.6",
    "pandas>=3.1,<3.2",
    "matplotlib>=3.11,<3.12",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.17,<0.18"]

[project.scripts]
cognishift = "cognishift.cli:main"

[tool.setuptools]
packages = ["cognishift"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
