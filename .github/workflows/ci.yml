name: Checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
        env:
          MPLBACKEND: Agg
      - run: python -m cognishift --synthetic --output-dir outputs/ci-example
        env:
          MPLBACKEND: Agg
